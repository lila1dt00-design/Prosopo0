:root{--bg:#0a0c11;--bg2:#10131a;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--fg:#f3f5f9;--mut:#98a2b3;--ac:#ff7a2f;--ac2:#ffb067;--ok:#35d07f;--bad:#ff5d5d;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:"FT Poppins","Noto Sans Arabic UI","Noto Sans Arabic","Noto Kufi Arabic","Droid Arabic Kufi","Segoe UI",Tahoma,Roboto,system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background-image:radial-gradient(900px 420px at 85% -80px,rgba(255,122,47,.22),transparent 60%),radial-gradient(700px 380px at -10% 12%,rgba(255,176,103,.10),transparent 60%);
  background-repeat:no-repeat;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 12px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0}
[hidden]{display:none!important}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:6px 0 10px}
.logo{width:46px;height:46px;border-radius:13px;overflow:hidden;background:#05060b;display:grid;place-items:center;box-shadow:none;border:0}.logo img{width:100%;height:100%;display:block}
.handle{direction:ltr;unicode-bidi:isolate;color:var(--ac2);font-weight:700;letter-spacing:.3px}
.logo svg{width:26px;height:26px}
.brand{flex:1;min-width:0}.brand b{display:block;font-size:21px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand span{display:block;font-size:12px;color:var(--mut)}
.ibtn{flex:none;width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--ac2);display:grid;place-items:center;padding:0}.ibtn svg{width:19px;height:19px}
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(3,5,10,.68);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:mfade .25s ease both}
.modal.closing{animation:mfadeout .22s ease forwards}
.modal .box{position:relative;width:100%;max-width:400px;max-height:calc(100dvh - 40px);overflow-x:hidden;overflow-y:auto;background:linear-gradient(165deg,#1b2030,#12151d 62%);border:1px solid rgba(255,255,255,.1);border-radius:26px;padding:22px 18px 16px;box-shadow:0 24px 70px rgba(0,0,0,.65);animation:mpop .5s cubic-bezier(.2,.9,.25,1.12) both}
.modal.closing .box{animation:mpopout .22s ease forwards}
.modal .box::before{content:"";position:absolute;top:-110px;inset-inline-end:-90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(150,100,255,.30),transparent 65%);pointer-events:none;animation:mglow 6s ease-in-out infinite alternate}
.mhead{position:relative;display:flex;align-items:center;gap:12px;margin-bottom:16px}
.mbadge{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#8a5cff,#ff7a2f);box-shadow:0 8px 22px rgba(150,100,255,.4);animation:mfloat 3s ease-in-out infinite}
.mbadge svg{width:24px;height:24px}
.modal h2{margin:0;font-size:18px;line-height:1.3}
.modal ul{position:relative;list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:9px}
.modal li{display:flex;gap:12px;align-items:center;font-size:14px;color:#dbe0ea;padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);animation:mrow .5s cubic-bezier(.2,.8,.25,1) backwards}
.modal li:nth-child(1){animation-delay:.12s}.modal li:nth-child(2){animation-delay:.22s}.modal li:nth-child(3){animation-delay:.32s}
.modal li .ck{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(53,208,127,.16);color:var(--ok)}
.modal li .ck svg{width:13px;height:13px}
.tg{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;text-decoration:none;color:#fff;background:linear-gradient(135deg,#2aabee,#1b7fd0);box-shadow:0 10px 26px rgba(34,158,217,.35);overflow:hidden;animation:mrow .5s .45s cubic-bezier(.2,.8,.25,1) backwards}
.tg::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.34),transparent);inset-inline-start:-50%;animation:mshine 3.4s 1.2s ease-in-out infinite;pointer-events:none}
.tg:active{transform:scale(.985)}
.tg .pl{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 4px rgba(255,255,255,.18)}
.tg .pl svg{width:40px;height:40px;animation:mfloat 3s ease-in-out infinite}
.tg .tx{flex:1;min-width:0;line-height:1.35}.tg .tx small{display:block;font-size:12px;opacity:.88}.tg .tx b{display:block;font-size:15px}
.tg .chev{flex:none;width:18px;height:18px;opacity:.92}
[dir=rtl] .tg .chev{transform:scaleX(-1)}
.modal .x{position:relative;width:100%;margin-top:12px;padding:12px;border-radius:14px;font-weight:700;font-size:14px;color:var(--fg);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
.modal .x:active{background:rgba(255,255,255,.12)}

.modal .box{padding:22px 18px 18px}
.mhead h2{font-size:19px;font-weight:700}
.mhead .msub{margin:2px 0 0;font-size:12.5px;color:var(--mut);line-height:1.5}
.car{position:relative;display:flex;margin:-12px -18px -6px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.car::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;min-width:0;padding:12px 18px 18px;scroll-snap-align:center;scroll-snap-stop:always;display:flex;flex-direction:column}
.sl ul{margin-bottom:0}
.modal li{line-height:1.6;font-weight:500;font-size:13.5px}
.modal li:nth-child(4){animation-delay:.42s}
.sl-tg{align-items:center;text-align:center;padding-top:34px}
.tgbig{position:relative;width:84px;height:84px;margin:6px 0 16px}
.tgbig::before,.tgbig::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(42,171,238,.65);animation:ripple 2.6s ease-out infinite}
.tgbig::after{animation-delay:1.3s}
.tgbig svg{position:relative;display:block;width:84px;height:84px;filter:drop-shadow(0 8px 18px rgba(42,171,238,.55));animation:mfloat 3s ease-in-out infinite}
.tgpill{display:inline-block;padding:4px 12px;margin-bottom:10px;border-radius:999px;font-size:11.5px;font-weight:700;color:#7fd0fa;background:rgba(42,171,238,.14);border:1px solid rgba(42,171,238,.4)}
.sl-tg h3{margin:0 0 8px;font-size:19px;line-height:1.4;font-weight:700}
.sl-tg p{margin:0 0 14px;font-size:13.5px;color:#c4cad6;line-height:1.75;max-width:310px}
.tgid{direction:ltr;unicode-bidi:isolate;margin-bottom:16px;font-size:14px;font-weight:700;color:var(--ac2);letter-spacing:.3px}
.sl-tg .tg{width:100%;text-align:start;margin-top:auto}
.dots{position:relative;display:flex;justify-content:center;align-items:center;gap:7px;margin:16px 0 0}
.dots i{display:block;width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.28);transition:width .28s ease,background .28s ease}
.dots i.on{width:22px;background:#fff}
.modal .x.nx{background:linear-gradient(135deg,var(--ac),#ff5d1a);border:0;color:#fff;box-shadow:0 8px 22px rgba(255,100,30,.32)}

.rot{position:relative;margin-top:14px}
.rot .tgh{margin-top:0}
.rstack{display:grid}
.rs{grid-area:1/1;opacity:0;visibility:hidden;transform:translateX(-22px);transition:opacity .5s ease,transform .5s ease,visibility 0s .5s}
[dir=ltr] .rs{transform:translateX(22px)}

/* ad card: fixed height = same as the old card, so the page never needs scrolling */
.adc .rstack{height:149.42px}
.adc .rdots{top:auto;bottom:6px;left:50%;right:auto;transform:translateX(-50%)}
[dir=ltr] .adc .rdots{left:50%;right:auto}
.adc .s1{padding:8px 12px 17px;gap:0;overflow:hidden}
/* glass capsule holding ALL the text */
.adc .cap{position:relative;display:flex;align-items:center;justify-content:space-between;box-sizing:border-box;width:100%;height:116px;padding:0 10px;border-radius:28px;overflow:hidden;
 background:linear-gradient(135deg,rgba(255,255,255,.20),rgba(255,255,255,.06) 55%,rgba(42,171,238,.10));
 -webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);
 border:1px solid rgba(255,255,255,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -12px 24px rgba(42,171,238,.08),0 10px 26px rgba(0,0,0,.35)}
.adc .cap .tgi{position:relative;z-index:2;flex:none;width:44px;height:44px;border-radius:50%;box-shadow:0 4px 14px rgba(42,171,238,.55)}
.adc .cap .tgi svg{width:44px;height:44px}
.adc .cap .ctr{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 4px;text-align:center}
.adc .cap .ctr .lb{display:block;font-size:11.5px;line-height:1.35;font-weight:700;color:#d2eeff;opacity:1}
.adc .cap .ctr b{display:block;font-size:18px;line-height:1.25;font-weight:800;color:#fff;white-space:nowrap}
.adc .cap .ctr .ds{display:block;font-style:normal;font-size:12.5px;line-height:1.4;font-weight:600;color:#fff;opacity:1;margin:0;text-wrap:balance}
.adc .cap .go2{flex:none;width:44px;display:grid;place-items:center}
.adc .cap .go2 i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#2aabee,#1b7fd0);box-shadow:0 4px 12px rgba(42,171,238,.5)}
.adc .cap .go2 .cv{width:18px;height:18px}
.adc .cap::after{content:"";position:absolute;top:0;bottom:0;width:28%;inset-inline-start:-40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);pointer-events:none}
/* intro: logo pops in a ring, grows into the glass capsule, text fades in */
.adc .rs.on .cap{animation:capgrow .9s cubic-bezier(.2,.8,.2,1) 1.7s both}
.adc .rs.on .cap .tgi{animation:tgpop .7s cubic-bezier(.2,.9,.3,1.3) 1s both}
.adc .rs.on .cap .ctr{animation:ctrin .6s ease-out 2.4s both}
.adc .rs.on .cap .go2{animation:ctrin .5s ease-out 2.5s both}
.adc .rs.on .cap::after{animation:capshine 1.6s ease-in-out 3.7s both}
@keyframes capgrow{0%{width:68px;height:68px;padding:0 5px;border-radius:99px;background:rgba(255,255,255,0);border-color:rgba(255,255,255,.55);box-shadow:none}100%{width:100%;height:116px;padding:0 10px;border-radius:28px}}
@keyframes tgpop{0%{transform:scale(.2);opacity:0}100%{transform:none;opacity:1}}
@keyframes ctrin{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes capshine{0%{inset-inline-start:-40%}100%{inset-inline-start:125%}}
.adc .rs:active .cap{transform:scale(.985)}
/* logo: new artwork, no background box, no glow */
.logo{background:transparent!important;border:0!important;border-radius:0!important;overflow:visible!important;width:54px;height:54px}
.logo img{object-fit:contain}
.brand b.wmb{display:flex;align-items:center;font-size:0;line-height:1}
.wm{height:32px;width:auto;display:block;color:#fff;overflow:visible}
html[lang="ar"] .adc .cap .lb,html[lang="ar"] .adc .cap .ds{font-weight:600!important}
/* logo glow removed */
.logo{box-shadow:none!important}
/* fonts: Arabic gets heavier, professional weights; no letter-spacing (it breaks Arabic joining) */
html[lang="ar"] body{font-family:"FT Poppins","FT Sorya","FT Plex Arabic","IBM Plex Sans Arabic","Noto Sans Arabic UI","Noto Sans Arabic","Droid Arabic Kufi","Segoe UI",Tahoma,Roboto,system-ui,sans-serif}
html[lang="ar"] body *{letter-spacing:0!important;font-weight:500!important}
html[lang="ar"] b,html[lang="ar"] strong,html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3,html[lang="ar"] button,html[lang="ar"] summary,html[lang="ar"] .brand b,html[lang="ar"] .tabs button,html[lang="ar"] .go,html[lang="ar"] .go *,html[lang="ar"] button *,html[lang="ar"] summary *,html[lang="ar"] b *{font-weight:700!important}
html[lang="ar"] .brand b,html[lang="ar"] .handle,html[lang="ar"] .tagline,html[lang="ar"] .tagline *{font-family:"FT Poppins",sans-serif}
html[lang="ar"] .drop span{font-size:12px;line-height:1.5}
/* file-format notice */
.modal .mbadge.warn{background:linear-gradient(135deg,#2aabee,#8a5cff);box-shadow:none}
.modal li.no{background:rgba(255,92,92,.10);border-color:rgba(255,92,92,.28);color:#ffd9d9}
.modal li.no .ck{background:rgba(255,92,92,.18);color:#ff6b6b}
.modal .fmbad{position:relative;margin:0 0 12px;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.6;color:#ffe3d1;background:rgba(255,122,47,.14);border:1px solid rgba(255,122,47,.4)}
.modal .fmtip{position:relative;margin:0 0 4px;font-size:13px;line-height:1.7;color:#c9d2e2}
.modal .x.pri{margin-top:10px;color:#fff;background:linear-gradient(135deg,#ff7a2f,#ff5f1f);border-color:transparent;box-shadow:0 8px 20px rgba(255,100,30,.3)}
</style>

<style id="ui18">
/* Arabic banner: bigger text that fills the capsule, sentence wraps into balanced lines */
html[lang="ar"] .adc .cap .ctr{gap:3px;padding:0 2px}
html[lang="ar"] .adc .cap .ctr .lb{font-size:clamp(13px,3.5vw,15.5px);line-height:1.35}
html[lang="ar"] .adc .cap .ctr b{font-size:clamp(20px,5.8vw,24px);line-height:1.25}
html[lang="ar"] .adc .cap .ctr .ds{font-size:clamp(14px,3.8vw,16px);line-height:1.4;text-wrap:balance}
/* advanced settings: keep inputs aligned even if a label wraps to two lines */
.grid label{justify-content:flex-end}
html[lang="ar"] .grid label{font-size:11.5px}
</style>
<style id="progmodal">
/* Converting popup: floats over the page so the layout never grows or scrolls */
#prog{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(5,7,11,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);touch-action:none;overscroll-behavior:contain}
#prog[hidden]{display:none}
#prog .pcard{width:100%;max-width:340px;margin:0;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pin .18s ease-out}
#prog .prog-top{margin-bottom:14px}
#prog .prog-top b{font-size:17px}
#prog .prog-top span{font-size:22px}
#prog .pcard{max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
#prog .steps{display:flex}
#prog.fin .pbody{display:none}
#prog:not(.fin) #summary,#prog:not(.fin) #results,#prog:not(.fin) .pclose,#prog:not(.fin) .pall{display:none}
#prog.fin .pcard{max-width:420px}
#prog #summary{margin:0 0 12px;padding:0 2px;font-size:15px}
#prog #results{display:flex;flex-direction:column;gap:12px}
#prog .pall{background:linear-gradient(135deg,var(--ac),#ff5d1a);border-color:transparent;color:#fff}
#prog .pall[hidden]{display:none}
#prog .pclose{display:block;width:100%;margin-top:14px;padding:13px;border-radius:14px;font-weight:800;font-size:14.5px;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--fg)}
#prog .muted:empty{display:none}
@keyframes pin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
html.prog-open,html.prog-open body{overflow:hidden}
</style>
<style id="pvcss">
#pvModal{z-index:120}
#pvModal[hidden]{display:none}
#pvModal .msub{margin:4px 0 0;font-size:13px;line-height:1.6;color:#c9d2e2}
#pvModal .mhead{margin-bottom:6px}
</style>
